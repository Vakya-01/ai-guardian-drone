<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Guardian Drone - SOS</title>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 92%;
      max-width: 430px;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    h1 {
      color: #17233c;
      margin: 0 0 8px;
      font-size: 30px;
    }

    .sub {
      color: #667085;
      font-size: 17px;
      margin-bottom: 25px;
    }

    #sos {
      width: 215px;
      height: 215px;
      border-radius: 50%;
      border: 12px solid #ffd5d5;
      background: #e53935;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(229,57,53,0.35);
    }

    #sos:active {
      transform: scale(0.96);
    }

    #sos:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 15px;
      background: #fff4f4;
      color: #a00000;
      font-size: 16px;
    }

    .location {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 15px;
      background: #eef9ee;
      border: 1px solid #b8dfb8;
      color: #176b2c;
      text-align: left;
    }

    .location h3 {
      margin-top: 0;
      text-align: center;
    }

    .map-button {
      display: block;
      margin-top: 15px;
      padding: 13px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      text-align: center;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #667085;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>AI Guardian Drone</h1>

    <div class="sub">
      Women's Safety & Emergency Response
    </div>

    <button id="sos">SOS</button>

    <div id="status">
      Ready. Press SOS in an emergency.
    </div>

    <div id="locationBox" class="location">
      <h3>📍 Victim's Location</h3>

      <div>
        <b>Latitude:</b>
        <span id="latitude">-</span>
      </div>

      <div>
        <b>Longitude:</b>
        <span id="longitude">-</span>
      </div>

      <a id="mapLink"
         class="map-button"
         target="_blank">
        View Location on Map
      </a>
    </div>

    <div class="note">
      School demonstration only — does not contact real emergency services.
    </div>

  </div>

<script>

const params = new URLSearchParams(window.location.search);

const policeId = params.get("police");

const sos = document.getElementById("sos");
const statusBox = document.getElementById("status");

const locationBox = document.getElementById("locationBox");
const latitudeText = document.getElementById("latitude");
const longitudeText = document.getElementById("longitude");
const mapLink = document.getElementById("mapLink");

let peer = null;
let connection = null;


/* --------------------------------
   CONNECT TO POLICE STATION
-------------------------------- */

if (!policeId) {

  statusBox.textContent =
    "⚠️ Police station connection is missing. Please open the SOS page using the QR code.";

} else {

  statusBox.textContent =
    "Connecting to demonstration police station...";

  peer = new Peer();

  peer.on("open", function() {

    connection = peer.connect(policeId, {
      reliable: true
    });

    connection.on("open", function() {

      statusBox.textContent =
        "✓ Connected to demonstration police station.";

    });

    connection.on("error", function() {

      statusBox.textContent =
        "⚠️ Could not connect to the police station.";

    });

  });

  peer.on("error", function() {

    statusBox.textContent =
      "⚠️ Internet connection unavailable. Please try again.";

  });

}


/* --------------------------------
   GET LOCATION
-------------------------------- */

function getLocation() {

  if (!navigator.geolocation) {

    statusBox.textContent =
      "Location services are not supported on this device.";

    return;

  }

  statusBox.textContent =
    "📍 Getting your current location...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      latitudeText.textContent =
        latitude.toFixed(6);

      longitudeText.textContent =
        longitude.toFixed(6);

      locationBox.style.display = "block";

      mapLink.href =
        "https://www.google.com/maps?q=" +
        latitude + "," + longitude;


      /* Send location to police station */

      if (connection && connection.open) {

        connection.send({

          type: "SOS",

          latitude: latitude,

          longitude: longitude,

          time: new Date().toLocaleString()

        });

        statusBox.textContent =
          "✓ SOS sent with victim's location.";

      } else {

        statusBox.textContent =
          "📍 Location found, but police station is not connected.";

      }

      sos.disabled = true;
      sos.textContent = "SENT";

    },

    function(error) {

      statusBox.textContent =
        "⚠️ Unable to get location. Please allow location permission.";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* --------------------------------
   SOS BUTTON
-------------------------------- */

sos.onclick = function() {

  getLocation();

};

</script>

</body>
</html>
