<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Guardian Drone — SOS</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:white;width:min(92%,430px);padding:30px;border-radius:25px;text-align:center;box-shadow:0 10px 35px #0002}
h1{color:#17233c;margin:0 0 7px}.sub{color:#667085;margin-bottom:25px}
#sos{width:215px;height:215px;border-radius:50%;border:11px solid #ffd5d5;background:#e53935;color:#fff;font-size:40px;font-weight:bold;cursor:pointer}
#sos:active{transform:scale(.96)}#status{margin-top:23px;font-weight:bold;color:#667085}.safe{color:#067647!important}
.note{font-size:12px;color:#98a2b3;margin-top:20px}
</style>
</head>
<body><div class="card">
<h1>AI Guardian Drone</h1><div class="sub">Women’s Safety & Emergency Response</div>
<button id="sos" disabled>SOS</button>
<div id="status">Connecting to the police station…</div>
<div class="note">School demonstration only — does not contact real emergency services.</div>
</div>
<script>
const params=new URLSearchParams(location.search), police=params.get("police");
const sos=document.getElementById("sos"), status=document.getElementById("status");
let peer,conn;
if(!police){status.textContent="Invalid SOS link. Please scan the QR code again.";}
else{
  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect(police,{reliable:true});
    conn.on("open",()=>{
      sos.disabled=false;
      status.textContent="✓ Connected to demonstration police station";
      status.className="safe";
    });
    conn.on("error",()=>status.textContent="Could not connect. Please scan the QR code again.");
  });
  peer.on("error",()=>status.textContent="Internet connection unavailable.");
}
sos.onclick=()=>{
  if(!conn||!conn.open)return;
  conn.send({type:"SOS",time:new Date().toLocaleString()});
  sos.disabled=true;
  sos.textContent="SENT";
  status.textContent="🚨 SOS SENT — help alert delivered to the police station.";
  status.className="";
};
</script>
</body></html>
